<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clear Outside Local UX Copy</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main>
      <section class="container address-panel" aria-label="Forecast lookup">
        <form id="forecast-form">
          <input id="latitude" name="latitude" type="text" value="48.21" aria-label="Latitude">
          <input id="longitude" name="longitude" type="text" value="16.97" aria-label="Longitude">
          <button id="open-map-picker" class="map-picker-trigger" type="button" aria-haspopup="dialog">or select on map</button>
          <button type="submit">Get Forecast <span aria-hidden="true" class="button-cloud"></span></button>
        </form>
      </section>

      <section class="container content-panel">
        <h1 id="forecast-title">Forecast for Dev&iacute;nska Nov&aacute; Ves, Okres Bratislava IV, Slovakia (48.21,16.97)</h1>

        <h2 id="forecast-meta">Loading current Open-Meteo forecast...</h2>

        <div class="actions">
          <label class="model-picker" for="model-select">
            <select id="model-select" name="model" aria-label="Forecast model"></select>
          </label>
          <div class="action-right">
            <button type="button" class="switch" data-forecast-action="center-midnight">Center on Midnight</button>
            <button type="button" class="switch" data-forecast-action="center-midday">Center on Midday</button>
            <button type="button" class="default" data-forecast-action="set-default">Set as Default Location</button>
          </div>
        </div>

        <section class="forecast-shell" aria-label="Astronomy weather forecast">
          <div id="forecast"></div>
        </section>

        <p id="forecast-status" class="provider" aria-live="polite">Powered by Open-Meteo Weather API</p>
      </section>
    </main>

    <div id="map-dialog" class="map-dialog" role="dialog" aria-modal="true" aria-labelledby="map-dialog-title" hidden>
      <div class="map-panel">
        <div class="map-panel-header">
          <div>
            <h2 id="map-dialog-title">Select forecast location</h2>
            <p>Click a point on the map, then use it for the forecast.</p>
          </div>
          <button id="close-map-picker" class="map-close" type="button" aria-label="Close map">x</button>
        </div>
        <div id="map-picker" class="map-canvas" tabindex="0" aria-label="OpenStreetMap location picker"></div>
        <div class="map-panel-footer">
          <output id="map-selected-coordinates">No point selected</output>
          <div class="map-panel-actions">
            <button id="cancel-map-picker" type="button">Cancel</button>
            <button id="use-map-picker" type="button" disabled>Use selected point</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="./script.js?v=20260504-map-picker"></script>
  </body>
</html>
